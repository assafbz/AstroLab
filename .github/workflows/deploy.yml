name: deploy

# The deploy path (`docs/DEPLOY.md`): CI builds the image, pushes it to ECR, and drives the host over
# SSM RunCommand. The host opens no inbound port and CI never gets a shell on it — the same shape the
# rest of the estate runs.
#
# Inert until provisioned. `deploy/provision-aws.sh` creates the registry, the role and the parameters
# and sets the `ASTROLAB_DEPLOY_ENABLED` repository variable; until that variable is `true` this job
# does nothing, so merging it before the owner provisions cannot redden `main`.
#
# This does not replace `ci.yml`: the `main-gate` repository ruleset still requires its three checks on
# every PR. Deploying is what happens *after* a merge, not a substitute for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — no long-lived AWS key is stored in the repo

concurrency:
  group: deploy
  cancel-in-progress: false # a deploy must finish; the next one queues behind it

jobs:
  deploy:
    name: build · push · SSM pull
    if: vars.ASTROLAB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The image tag is the commit sha, so a deploy is identifiable and a rollback is one tag.
      - name: resolve the registry
        id: ecr
        run: |
          uri=$(aws ecr describe-repositories --repository-names astrolab \
            --query 'repositories[0].repositoryUri' --output text)
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.uri }}:${{ github.sha }}
          # Buildx cache in the registry: the client build and `npm ci` layers are reused across
          # deploys instead of rebuilt from scratch.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.uri }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.uri }}:buildcache,mode=max

      - name: deploy on the host (SSM RunCommand)
        env:
          IMAGE: ${{ steps.ecr.outputs.uri }}:${{ github.sha }}
          INSTANCE: ${{ vars.AWS_EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          # The host path in one script: log in, pull the image, hand off to the deploy script inside
          # it. The first deploy has no bundle on the host yet, so it is extracted here; `deploy.sh`
          # then refreshes the bundle, installs the units and brings the stack up.
          params=$(jq -n --arg img "$IMAGE" --arg region "$REGION" '{commands: [(
            "set -euo pipefail",
            "IMG=\($img)",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin ${IMG%%/*}",
            "docker pull \"$IMG\"",
            "cid=$(docker create \"$IMG\")",
            "docker cp \"$cid:/app/deploy/.\" /opt/astrolab/",
            "docker rm -f \"$cid\"",
            "exec bash /opt/astrolab/deploy.sh \"$IMG\""
          )]}')

          command_id=$(aws ssm send-command \
            --region "$REGION" \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE" \
            --comment "AstroLab deploy $IMAGE" \
            --parameters "$params" \
            --query 'Command.CommandId' --output text)

          # Bounded wait — the waiter, not a hand-rolled loop. The first pull is the slow part.
          AWS_MAX_ATTEMPTS=60 AWS_POLL_DELAY_SECONDS=5 \
            aws ssm wait command-executed --region "$REGION" \
            --command-id "$command_id" --instance-id "$INSTANCE" || true

          status=$(aws ssm get-command-invocation --region "$REGION" \
            --command-id "$command_id" --instance-id "$INSTANCE" --query Status --output text)
          aws ssm get-command-invocation --region "$REGION" \
            --command-id "$command_id" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          if [ "$status" != "Success" ]; then
            echo "::error::deploy on $INSTANCE failed: $status"
            aws ssm get-command-invocation --region "$REGION" \
              --command-id "$command_id" --instance-id "$INSTANCE" --query StandardErrorContent --output text
            exit 1
          fi

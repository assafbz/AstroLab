name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  citations:
    name: citation ref-lint — §X.Y item N form
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint:citations
      - run: npm run lint:citations -- --self-check

  zdr-evidence:
    name: PRIV1 — capture OpenRouter's ZDR endpoint list (non-required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/capture-zdr.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zdr-endpoints
          path: artifacts/zdr-endpoints.json
          retention-days: 90

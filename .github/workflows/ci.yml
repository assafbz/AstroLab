name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The seed ships as **text in the bundle** (#184): a device has no filesystem, so the entry must
      # seed without reading one. Prove it on the *built* entry — the import and the seed that only work
      # under tsx are exactly what this catches.
      - name: the built entry seeds a vault from the bundled taxonomy, with no filesystem
        run: |
          node --input-type=module -e "
            const core = await import('@astrolab/core');
            const { openNodeStore } = await import('@astrolab/core/dist/store/connection.node.js');
            const db = openNodeStore(':memory:');
            core.migrate(db, core.MIGRATIONS);
            core.seedDomainTaxonomy(db);
            const n = Number(db.prepare('SELECT count(*) AS n FROM domain_map').get().n);
            if (n !== 264) throw new Error('bundled taxonomy seeded ' + n + ' rows, expected 264');
            console.log('built entry seeded', n, 'domain_map rows from the bundled taxonomy');
          "

  o1-taxonomy:
    name: o1-taxonomy — canonical harness on the shipped seed file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # The verdict is a function of the shipped bytes, so the harness runs on the file the loader
      # reads — not on a reconstruction. The header prints (curr, prev, harness, fixture) hashes.
      - name: canonical harness — the shipped file must PASS
        run: python3 core/test/o1_check.py core/seed/domain-taxonomy.yaml core/test/o1-fixture.txt
      # `--strict` drops normalisation and the key fallback, so it must FAIL: those rules cannot
      # silently disappear without this step going red.
      - name: --strict is the negative test — it must FAIL
        run: |
          if python3 core/test/o1_check.py core/seed/domain-taxonomy.yaml core/test/o1-fixture.txt --strict; then
            echo "::error::--strict was expected to fail — the normalisation rules are not doing their job"
            exit 1
          fi

  citations:
    name: citation ref-lint — §X.Y item N form
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint:citations
      - run: npm run lint:citations -- --self-check

  zdr-evidence:
    name: PRIV1 — capture + audit OpenRouter's ZDR endpoint list (non-required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The audit imports `DEFAULT_MODEL` from the boundary, so it needs the workspace installed —
      # `capture-zdr.mjs` needs nothing, but `audit-zdr.ts` reads the code it is auditing.
      - run: npm ci
      # The audit's own non-vacuity, on every PR: each check is driven with a synthetic artifact that
      # must make it bite, so a rule that quietly stopped biting is a red job — the way `citations` runs
      # its sibling's self-check. Offline, so it runs before the capture.
      - run: npm run audit:zdr -- --self-check
      - run: node scripts/capture-zdr.mjs
      # EV6 (#48): the artifact's consumer. Fails closed — no artifact, or a model the provider does
      # not classify ZDR, is a red job, not an unread upload. Still non-required, so provider downtime
      # cannot redden a merge (F1's note).
      - run: npm run audit:zdr
      - uses: actions/upload-artifact@v4
        with:
          name: zdr-endpoints
          path: artifacts/zdr-endpoints.json
          retention-days: 90

# AstroLab — the host's unit set (`docs/ARCHITECTURE.md` §1).
#
# Extracted from the image by `deploy/deploy.sh` and brought up as `docker compose up -d` under
# `deploy/systemd/astrolab.service`. The image tag is the only thing a deploy changes
# (`docs/DEPLOY.md`, "rollback").
#
# Secrets: only `DOPPLER_TOKEN` reaches a container's environment, and only the three services that
# resolve app secrets need it. Each entrypoint runs `doppler run` inside its own container, so no app
# secret is written down here and none sits on the host (`docs/DEPLOY.md`, "secrets"). `ASTROLAB_IMAGE`
# and `DOPPLER_TOKEN` are exported by `deploy.sh`; compose interpolates them from the environment, so
# neither is stored in a file.
name: astrolab

x-app: &app
  image: ${ASTROLAB_IMAGE:?ASTROLAB_IMAGE is required}
  restart: unless-stopped

# The Doppler handle every secret-resolving service needs. The app's own secrets (API_TOKEN,
# OPENROUTER_API_KEY, AI_MODEL) are never listed: `doppler run` injects them inside the container.
x-secrets: &secrets
  DOPPLER_TOKEN: ${DOPPLER_TOKEN:?DOPPLER_TOKEN is required}
  DOPPLER_PROJECT: ${DOPPLER_PROJECT:-astrolab}
  DOPPLER_CONFIG: ${DOPPLER_CONFIG:-prd}

services:
  # The vault: `/v1`, `/healthz`. Reads and writes the one SQLite file (`docs/ARCHITECTURE.md` §1).
  api:
    <<: *app
    command: ["node", "api/dist/index.js"]
    environment:
      <<: *secrets
      DB_PATH: /data/astrolab.sqlite
      API_PORT: "8080"
    volumes:
      - ${ASTROLAB_DATA:-/opt/astrolab/data}:/data
    healthcheck:
      # `/healthz` answers before the auth gate and needs no token (`api/src/server.ts`), so this is
      # a liveness probe, not an auth probe.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The spark engine: the same store, the other writer (`docs/ARCHITECTURE.md` §1, ADR-0004).
  worker:
    <<: *app
    command: ["node", "worker/dist/index.js"]
    environment:
      <<: *secrets
      DB_PATH: /data/astrolab.sqlite
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v4-flash}
    volumes:
      - ${ASTROLAB_DATA:-/opt/astrolab/data}:/data

  # One-shot: copy the built client into the shared webroot with the real bearer substituted. Fails
  # closed when the token is empty or the build kept no sentinel (`deploy/web-init.mjs`). `web` waits
  # for it, so a deploy cannot serve an unauthenticated client.
  web-init:
    <<: *app
    command: ["node", "deploy/web-init.mjs"]
    restart: "no"
    environment:
      <<: *secrets
    volumes:
      - webroot:/webroot

  # The one origin: the client bundle and `/v1` on the same host (`docs/ARCHITECTURE.md` §1), so the
  # client's relative `fetch("/v1/…")` needs no CORS and no `VITE_API_URL` (`client/vite.config.ts`).
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    # Loopback only. The host is reachable through Tailscale, never a public port
    # (`docs/DEPLOY.md`, "access").
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - webroot:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  webroot:
